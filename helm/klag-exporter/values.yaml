# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /health
    port: http
readinessProbe:
  httpGet:
    path: /ready
    port: http

config:
  exporter:
    poll_interval: "30s"
    http_port: 8000
    http_host: "0.0.0.0"
    granularity: "topic"
    # How long a cluster's metrics remain in /metrics after the last successful
    # collection before being filtered out. Unset (default) => poll_interval * 3,
    # which scales automatically with poll_interval. Set explicitly on large
    # clusters where a single collection cycle can take several minutes.
    # staleness_threshold: "3m"
  exporter.timestamp_sampling:
    enabled: true
    # Time-lag estimation mode: "rate" (default) or "message".
    # "rate"    - Estimate from observed high-watermark production rate. No consumer pool, scales to any cluster size.
    # "message" - Read the actual Kafka message at the committed offset. Exact, but requires a pooled BaseConsumer per fetch.
    mode: "rate"
    # Message-mode settings (ignored when mode = "rate"):
    # cache_ttl: "60s"
    # max_concurrent_fetches: 10
    # fetch_timeout: "5s"
    # Skip the fetch for every partition whose committed offset has fallen below
    # the low watermark, i.e. retention deleted the committed message. Such a
    # fetch resets to the earliest surviving offset and, on a drained partition,
    # blocks for the full fetch timeout. The partition is still reported either
    # way, with its offset lag and data_loss_detected; the trade-off is that time
    # lag reports 0 rather than the age of the earliest surviving message.
    # skip_data_loss_partitions: false
    # Rate-mode settings (ignored when mode = "message"):
    # rate_history_samples: 5
    # rate_history_max_age: "10m"
    # rate_min_msgs_per_sec: 0.01
  exporter.otel:
    enabled: false
    endpoint: "http://localhost:4317"
    export_interval: "60s"
  exporter.performance:
    # Timeout for Kafka API operations (metadata, watermarks, etc.)
    kafka_timeout: "30s"
    # Timeout for fetching committed offsets per consumer group
    offset_fetch_timeout: "10s"
    # Additional attempts for retriable failures while fetching consumer-group
    # descriptions and committed offsets (DescribeConsumerGroups and
    # ListConsumerGroupOffsets). Set to 0 to disable retries.
    group_fetch_retries: 0
    # Maximum consumer groups to fetch offsets for in parallel
    max_concurrent_groups: 10
    # Maximum partitions to fetch watermarks for in parallel
    max_concurrent_watermarks: 50
    # Tokio blocking-thread pool. Shared by ALL cluster loops in the process.
    # Multi-cluster sizing: clusters * (max_concurrent_groups + sampler) + 4 headroom.
    # sampler = timestamp_sampling.max_concurrent_fetches when enabled && mode="message", else 0.
    max_blocking_threads: 64
    # Recycle librdkafka clients every N cycles to release accumulated metadata.
    # Set to 0 to disable. Default: 50 (~25 min at 30s poll interval).
    client_recycle_interval: 50
  exporter.leadership:
    # Enable Kubernetes leader election for HA deployments (multiple replicas).
    # When false (default), leader election is skipped and the instance collects unconditionally.
    enabled: false
    # Leadership provider. Currently only "kubernetes" is supported.
    provider: "kubernetes"
    # Name of the Kubernetes Lease resource used for leader election.
    lease_name: "klag-exporter"
    # Namespace where the Lease resource is created. If empty, the application will use its own default.
    lease_namespace: ""
    # Duration in seconds the lease is valid before it expires.
    lease_duration_secs: 15
    # Grace period in seconds for lease renewal. Must be less than lease_duration_secs.
    grace_period_secs: 5
    # Identity of this instance for the Lease. Defaults to POD_NAME or HOSTNAME env var.
    # identity: ""
  clusters:
    - name: "cluster-1"
      bootstrap_servers: "kafka:9092"
      group_whitelist: [".*"]
      group_blacklist: []
      topic_whitelist: [".*"]
      topic_blacklist: ["^__.*"] # Exclude internal topics like __consumer_offsets
      clusters.consumer_properties: {}
      # Custom labels added to all metrics for this cluster. Example:
      # labels:
      #   environment: "production"
      #   datacenter: "us-east-1"
      labels: {}
      # Any valid consumer property can be set here, for example:
      # security.protocol: "SASL_SSL"
      # sasl.mechanism: "PLAIN"
      # sasl.username: "${KAFKA_USER}"
      # sasl.password: "${KAFKA_PASSWORD}"
      # ssl.ca.location: "/path/to/ca.pem"
      # ssl.certificate.location: "/path/to/client.pem"
      # ssl.key.location: "/path/to/client.key"

customSecretVolumes: {}

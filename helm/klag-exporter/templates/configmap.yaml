apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "klag-exporter.fullname" . }}-config
  labels:
    {{- include "klag-exporter.labels" . | nindent 4 }}
data:
  config.toml: |
    [exporter]
    {{- with .Values.config.exporter }}
    poll_interval = {{ .poll_interval | quote }}
    http_port = {{ .http_port }}
    http_host = {{ .http_host | quote }}
    granularity = {{ .granularity | quote }}
    {{- if .staleness_threshold }}
    staleness_threshold = {{ .staleness_threshold | quote }}
    {{- end }}
    {{- end }}

    [exporter.timestamp_sampling]
    {{- with index .Values.config "exporter.timestamp_sampling" }}
    enabled = {{ .enabled }}
    mode = {{ .mode | quote }}
    {{- if .cache_ttl }}
    cache_ttl = {{ .cache_ttl | quote }}
    {{- end }}
    {{- if .max_concurrent_fetches }}
    max_concurrent_fetches = {{ .max_concurrent_fetches }}
    {{- end }}
    {{- if .fetch_timeout }}
    fetch_timeout = {{ .fetch_timeout | quote }}
    {{- end }}
    {{- if .rate_history_samples }}
    rate_history_samples = {{ .rate_history_samples }}
    {{- end }}
    {{- if .rate_history_max_age }}
    rate_history_max_age = {{ .rate_history_max_age | quote }}
    {{- end }}
    {{- if hasKey . "rate_min_msgs_per_sec" }}
    rate_min_msgs_per_sec = {{ .rate_min_msgs_per_sec }}
    {{- end }}
    {{- end }}

    [exporter.otel]
    {{- with index .Values.config "exporter.otel" }}
    enabled = {{ .enabled }}
    endpoint = {{ .endpoint | quote }}
    export_interval = {{ .export_interval | quote }}
    {{- end }}

    [exporter.performance]
    {{- with index .Values.config "exporter.performance" }}
    kafka_timeout = {{ .kafka_timeout | quote }}
    offset_fetch_timeout = {{ .offset_fetch_timeout | quote }}
    max_concurrent_groups = {{ .max_concurrent_groups }}
    max_concurrent_watermarks = {{ .max_concurrent_watermarks }}
    max_blocking_threads = {{ .max_blocking_threads }}
    client_recycle_interval = {{ .client_recycle_interval }}
    {{- end }}

    [exporter.leadership]
    {{- with index .Values.config "exporter.leadership" }}
    # NOTE: When leadership is enabled and provider is "kubernetes", the service account
    # running this exporter must have RBAC permissions on leases.coordination.k8s.io:
    # get, list, watch, create, update, and patch. This chart does not provision these
    # Roles/RoleBindings; they must be created separately.
    enabled = {{ .enabled }}
    provider = {{ .provider | quote }}
    lease_name = {{ .lease_name | quote }}
    lease_namespace = {{ .lease_namespace | quote }}
    lease_duration_secs = {{ .lease_duration_secs }}
    grace_period_secs = {{ .grace_period_secs }}
    {{- if .identity }}
    identity = {{ .identity | quote }}
    {{- end }}
    {{- end }}

    {{- range .Values.config.clusters }}
    [[clusters]]
    name = {{ .name | quote }}
    bootstrap_servers = {{ .bootstrap_servers | quote }}
    group_whitelist = [{{- range $i, $v := .group_whitelist }}{{- if $i }}, {{ end }}{{ $v | quote }}{{- end }}]
    group_blacklist = [{{- range $i, $v := .group_blacklist }}{{- if $i }}, {{ end }}{{ $v | quote }}{{- end }}]
    topic_whitelist = [{{- range $i, $v := .topic_whitelist }}{{- if $i }}, {{ end }}{{ $v | quote }}{{- end }}]
    topic_blacklist = [{{- range $i, $v := .topic_blacklist }}{{- if $i }}, {{ end }}{{ $v | quote }}{{- end }}]
    {{- if index . "clusters.consumer_properties" }}

    [clusters.consumer_properties]
    {{- range $key, $value := index . "clusters.consumer_properties" }}
    {{ $key | quote }} = {{ $value | quote }}
    {{- end }}
    {{- end }}
    {{- if .labels }}

    [clusters.labels]
    {{- range $key, $value := .labels }}
    {{ $key | quote }} = {{ $value | quote }}
    {{- end }}
    {{- end }}
    {{- end }}
